[package]
name = "qaoa-portfolio"
version = "0.1.0"
edition = "2024"
authors = ["dasobral <dasobral93@gmail.com>"]
description = "High-performance QAOA implementation for portfolio optimization"
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/dasobral/qaoa-portfolio"
keywords = ["quantum", "optimization", "portfolio", "finance", "qaoa"]
categories = ["science", "algorithms", "mathematics"]

[lib]
name = "qaoa_portfolio"
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = { version = "0.32", features = ["serde-serialize"] }
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", features = ["std_rng"] }
thiserror = "1.0"

# CLI (optional, for standalone usage)
clap = { version = "4.4", features = ["derive"], optional = true }

# Python bindings (Phase 2D)
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.2"

[features]
default = []
cli = ["clap"]
python-bindings = ["pyo3", "numpy"]

# Benchmarks (Phase 2)
[[bench]]
name = "qaoa_portfolio"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
debug = true
